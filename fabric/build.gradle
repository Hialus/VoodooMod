plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    modLocalRuntime "vazkii.patchouli:Patchouli:${patchouli_version}-FABRIC"
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        gameTest {
            server()
            setConfigName('Fabric Game Test')
            ideConfigGenerated(true)
            runDir('runs/gametest')
            source(sourceSets.gametest)
            property('fabric-api.gametest')
            property('fabric-api.gametest.report-file', project.layout.buildDirectory.file('gametest/report.xml').get().asFile.absolutePath)
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
}

sourceSets.main.resources { srcDir project(':common').file('src/generated/resources') }

configurations {
    commonGametestJava {
        canBeResolved = true
    }
    commonGametestResources {
        canBeResolved = true
    }
}

dependencies {
    commonGametestJava project(path: ':common', configuration: 'commonGametestJava')
    commonGametestResources project(path: ':common', configuration: 'commonGametestResources')
}

tasks.named('compileGametestJava', JavaCompile) {
    dependsOn(configurations.commonGametestJava)
    source(configurations.commonGametestJava)
}

tasks.named('processGametestResources', ProcessResources) {
    dependsOn(configurations.commonGametestResources)
    from(configurations.commonGametestResources)
}
