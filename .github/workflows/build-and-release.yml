name: Build and Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Only release this branch (leave empty to release all branches in the matrix)'
        required: false
        default: ''
      changelog:
        description: 'Custom changelog (leave empty to generate it from commits). \n for line breaks.'
        required: false
        default: ''

permissions:
  contents: write

env:
  CURSEFORGE_ID: 510930
  MODRINTH_ID: 2u9JONvp

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: 1.21.1
            game_versions: ''
          - branch: 1.21.4
            game_versions: ''
          - branch: 26.1
            game_versions: ''

    steps:
    - name: Checkout repository
      if: inputs.branch == '' || inputs.branch == matrix.branch
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
        lfs: true
        fetch-depth: 0

    - name: Read versions
      if: inputs.branch == '' || inputs.branch == matrix.branch
      uses: actions/github-script@v7
      env:
        MATRIX_GAME_VERSIONS: ${{ matrix.game_versions }}
      with:
        script: |
          const fs = require('fs');

          const properties = Object.fromEntries(
            fs.readFileSync('gradle.properties', 'utf8')
              .split(/\r?\n/)
              .filter(line => line.includes('=') && !line.trimStart().startsWith('#'))
              .map(line => {
                const index = line.indexOf('=');
                return [line.slice(0, index).trim(), line.slice(index + 1).trim()];
              })
          );

          const mcVersion = properties['minecraft_version'];
          const modVersion = properties['version'];

          core.exportVariable('MC_VERSION', mcVersion);
          core.exportVariable('MOD_VERSION', modVersion);
          core.exportVariable('JAVA_VERSION', properties['java_version']);
          core.exportVariable('RELEASE_TAG', `${mcVersion}-${modVersion}`);
          core.exportVariable('GAME_VERSIONS', process.env.MATRIX_GAME_VERSIONS || mcVersion);

          core.info(`Branch ${{ matrix.branch }}: Minecraft ${mcVersion}, Mod ${modVersion}, Java ${properties['java_version']}`);

    - name: Check for existing releases
      id: check
      if: inputs.branch == '' || inputs.branch == matrix.branch
      uses: actions/github-script@v7
      env:
        MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      with:
        script: |
          const tag = process.env.RELEASE_TAG;

          try {
            await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            core.warning(`Release ${tag} already exists. Bump 'version' in gradle.properties to release again.`, { title: '${{ matrix.branch }} skipped' });
            core.setOutput('release', 'false');
            return;
          } catch (error) {
            if (error.status !== 404) throw error;
          }
          core.setOutput('release', 'true');

          const response = await fetch(`https://api.modrinth.com/v2/project/${process.env.MODRINTH_ID}/version`, {
            headers: { Authorization: process.env.MODRINTH_TOKEN },
          });
          if (!response.ok) {
            throw new Error(`Could not read Modrinth versions: ${response.status} ${response.statusText}`);
          }
          const existing = (await response.json()).map(version => version.version_number.toLowerCase());

          for (const loader of ['neoforge', 'fabric']) {
            const versionNumber = `${tag}-${loader}`;
            const exists = existing.includes(versionNumber);
            if (exists) core.notice(`${versionNumber} already exists on Modrinth, skipping that upload.`);
            core.setOutput(`modrinth_${loader}`, String(!exists));
          }

    - name: Generate changelog
      if: steps.check.outputs.release == 'true'
      uses: actions/github-script@v7
      env:
        CUSTOM_CHANGELOG: ${{ inputs.changelog }}
      with:
        script: |
          let changelog = process.env.CUSTOM_CHANGELOG.trim().replaceAll('\\n', '\n');

          if (!changelog) {
            const mcVersion = process.env.MC_VERSION;
            const { stdout: previousTag } = await exec.getExecOutput(
              'git', ['describe', '--tags', '--abbrev=0', '--match', `${mcVersion}-*`],
              { ignoreReturnCode: true, silent: true }
            );

            if (previousTag.trim()) {
              const { stdout: log } = await exec.getExecOutput(
                'git', ['log', `${previousTag.trim()}..HEAD`, '--no-merges', '--pretty=- %s'],
                { silent: true }
              );
              changelog = log.split('\n')
                .filter(line => line && !/Revert|Update|\[NC\]/.test(line))
                .join('\n');
            } else {
              changelog = `Release for Minecraft ${mcVersion}`;
            }
          }

          core.info(changelog);
          core.exportVariable('CHANGELOG', changelog);

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      if: steps.check.outputs.release == 'true'
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    - name: Set up Gradle
      if: steps.check.outputs.release == 'true'
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      if: steps.check.outputs.release == 'true'
      run: chmod +x gradlew

    - name: Run datagen
      if: steps.check.outputs.release == 'true'
      run: ./gradlew :neoforge:runData
      continue-on-error: true

    - name: Remove .cache folder
      if: steps.check.outputs.release == 'true'
      run: rm -rf common/src/generated/resources/.cache

    - name: Build with Gradle
      if: steps.check.outputs.release == 'true'
      run: ./gradlew build

    - name: Publish NeoForge to Modrinth
      if: steps.check.outputs.modrinth_neoforge == 'true' && hashFiles(format('neoforge/build/libs/voodoo-neoforge-{0}.jar', env.RELEASE_TAG)) != ''
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ env.MODRINTH_ID }}
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        files: neoforge/build/libs/voodoo-neoforge-${{ env.RELEASE_TAG }}.jar
        name: Voodoo ${{ env.MOD_VERSION }} (NeoForge ${{ env.MC_VERSION }})
        version: ${{ env.RELEASE_TAG }}-neoforge
        version-type: release
        changelog: ${{ env.CHANGELOG }}
        loaders: neoforge
        game-versions: ${{ env.GAME_VERSIONS }}
        java: ${{ env.JAVA_VERSION }}
        dependencies: |
          patchouli(optional)

    - name: Publish Fabric to Modrinth
      if: steps.check.outputs.modrinth_fabric == 'true' && hashFiles(format('fabric/build/libs/voodoo-fabric-{0}.jar', env.RELEASE_TAG)) != ''
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        modrinth-id: ${{ env.MODRINTH_ID }}
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
        files: fabric/build/libs/voodoo-fabric-${{ env.RELEASE_TAG }}.jar
        name: Voodoo ${{ env.MOD_VERSION }} (Fabric ${{ env.MC_VERSION }})
        version: ${{ env.RELEASE_TAG }}-fabric
        version-type: release
        changelog: ${{ env.CHANGELOG }}
        loaders: fabric
        game-versions: ${{ env.GAME_VERSIONS }}
        java: ${{ env.JAVA_VERSION }}
        dependencies: |
          fabric-api(required){modrinth:fabric-api}
          forgeconfigapiport(required){modrinth:forge-config-api-port}
          patchouli(optional)

    - name: Publish NeoForge to CurseForge
      if: steps.check.outputs.release == 'true' && hashFiles(format('neoforge/build/libs/voodoo-neoforge-{0}.jar', env.RELEASE_TAG)) != ''
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        curseforge-id: ${{ env.CURSEFORGE_ID }}
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
        files: neoforge/build/libs/voodoo-neoforge-${{ env.RELEASE_TAG }}.jar
        name: Voodoo ${{ env.MOD_VERSION }} (NeoForge ${{ env.MC_VERSION }})
        version: ${{ env.RELEASE_TAG }}-neoforge
        version-type: release
        changelog: ${{ env.CHANGELOG }}
        loaders: neoforge
        game-versions: ${{ env.GAME_VERSIONS }}
        java: ${{ env.JAVA_VERSION }}
        dependencies: |
          patchouli(optional)

    - name: Publish Fabric to CurseForge
      if: steps.check.outputs.release == 'true' && hashFiles(format('fabric/build/libs/voodoo-fabric-{0}.jar', env.RELEASE_TAG)) != ''
      uses: Kir-Antipov/mc-publish@v3.3
      with:
        curseforge-id: ${{ env.CURSEFORGE_ID }}
        curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
        files: fabric/build/libs/voodoo-fabric-${{ env.RELEASE_TAG }}.jar
        name: Voodoo ${{ env.MOD_VERSION }} (Fabric ${{ env.MC_VERSION }})
        version: ${{ env.RELEASE_TAG }}-fabric
        version-type: release
        changelog: ${{ env.CHANGELOG }}
        loaders: fabric
        game-versions: ${{ env.GAME_VERSIONS }}
        java: ${{ env.JAVA_VERSION }}
        dependencies: |
          fabric-api(required){curseforge:fabric-api}
          forgeconfigapiport(required){curseforge:forge-config-api-port-fabric}
          patchouli(optional)

    - name: Create GitHub Release
      if: steps.check.outputs.release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: VoodooMod ${{ env.RELEASE_TAG }}
        body: ${{ env.CHANGELOG }}
        target_commitish: ${{ matrix.branch }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          LICENSE_CODE
          LICENSE_ASSETS
          */build/libs/voodoo-*-${{ env.RELEASE_TAG }}.jar
